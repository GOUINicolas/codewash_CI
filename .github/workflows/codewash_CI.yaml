name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "debt-*"
  workflow_dispatch:

env:
  WORKING_DIR: CodeWashGame

jobs:
  quality-and-tests:
    name: Lint, Static Analysis, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR || '.' }}
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR ? format('{0}/package-lock.json', env.WORKING_DIR) : 'package-lock.json' }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check cyclomatic complexity (static analysis)
        run: npx eslint . --rule '{"complexity":["error",10]}'

      - name: Check code duplication (static analysis)
        run: npx jscpd src --min-lines 5 --threshold 5

      - name: Run Vitest with coverage
        run: npx vitest run --coverage

      - name: Build production bundle
        run: npm run build